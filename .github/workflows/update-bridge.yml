name: Update Trade Bridge

on:
  schedule:
    # Every Monday at 06:00 UTC (after typical weekend patch windows)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate bridge file
        run: |
          python data/scripts/generate_bridge.py --output data/poe_trade_bridge.json

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet data/poe_trade_bridge.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poe_trade_bridge.json data/poe_trade_bridge.pretty.json
          STAT_COUNT=$(python -c "import json; print(len(json.load(open('data/poe_trade_bridge.json'))))")
          git commit -m "chore: regenerate trade bridge (${STAT_COUNT} stats)"
          git push
